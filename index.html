<!DOCTYPE html>
<!-- Dit au navigateur que c'est du HTML moderne (HTML5) -->
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- Indispensable pour le mobile : la page s'adapte à la largeur de l'écran -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quel film ce soir ?</title>
  <meta name="description" content="Choisis ton humeur et ta durée, on te trouve LE film de ce soir." />

  <!-- ===== Open Graph : l'aperçu quand on colle le lien sur Facebook / WhatsApp ===== -->
  <!-- Remplace TON-SITE.netlify.app par ta vraie adresse (les URLs doivent être ABSOLUES) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Quel film ce soir ?" />
  <meta property="og:description" content="Dis-moi ton humeur, je choisis ton film en 2 clics. 🎬" />
  <meta property="og:image" content="https://TON-SITE.netlify.app/og-image.jpg" />
  <meta property="og:url" content="https://TON-SITE.netlify.app/" />

  <!-- X (Twitter) : utilise les og: ci-dessus, il lui faut juste le type de carte -->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Tailwind CSS via CDN : on écrit le style avec des classes (ex: bg-black, p-4) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Ton CSS perso (animations, hover, carte film). Il vient APRÈS Tailwind pour pouvoir le compléter -->
  <link rel="stylesheet" href="style.css" />
</head>

<!-- Fond sombre, texte clair, hauteur min = tout l'écran -->
<body class="min-h-screen bg-zinc-950 text-zinc-100 font-sans antialiased">

  <!-- Conteneur centré : max-w-md = largeur max (mobile first), mx-auto = centré, px-4 = marges latérales -->
  <main class="mx-auto flex max-w-md flex-col items-center px-4 py-10">

    <!-- ===== BLOC 1 : le titre ===== -->
    <header class="mb-8 text-center">
      <h1 class="text-4xl font-extrabold leading-tight sm:text-5xl">
        Quel film <span class="text-amber-400">ce soir ?</span>
      </h1>
      <p class="mt-3 text-zinc-400">Dis-moi ton humeur, je choisis pour toi.</p>
    </header>

    <!-- ===== BLOC 2 : le formulaire (2 menus + 1 bouton) ===== -->
    <!-- Pas de <form> : on gère le clic en JS, donc pas de rechargement de page -->
    <section class="w-full space-y-4">

      <!-- Menu Humeur : les value (peur, rire...) sont lues par app.js -->
      <div>
        <label for="humeur" class="mb-1 block text-sm text-zinc-400">Humeur</label>
        <select id="humeur"
          class="w-full rounded-xl border border-zinc-800 bg-zinc-900 p-3 text-zinc-100 focus:border-amber-400 focus:outline-none">
          <option value="peur">😱 Peur</option>
          <option value="rire">😂 Rire</option>
          <option value="amour">❤️ Amour</option>
          <option value="action">💥 Action</option>
          <option value="reflexion">🧠 Réflexion</option>
        </select>
      </div>

      <!-- Menu Durée : value = minutes max ("" = pas de limite) -->
      <div>
        <label for="duree" class="mb-1 block text-sm text-zinc-400">Durée max</label>
        <select id="duree"
          class="w-full rounded-xl border border-zinc-800 bg-zinc-900 p-3 text-zinc-100 focus:border-amber-400 focus:outline-none">
          <option value="90">1h30</option>
          <option value="120">2h</option>
          <option value="150">2h30</option>
          <option value="">Peu importe</option>
        </select>
      </div>

      <!-- Bouton principal (id utilisé par app.js ET style.css) -->
      <button id="btn-trouver"
        class="w-full rounded-xl bg-amber-400 px-6 py-3 text-lg font-bold text-zinc-950">
        Trouve-moi un film 🎬
      </button>
    </section>

    <!-- ===== BLOC 3 : zone vide où app.js affichera le film ===== -->
    <div id="resultat" class="mt-8 w-full"></div>

  </main>

  <!-- Le JS en dernier : le HTML est déjà chargé quand il s'exécute. "defer" = sécurité en plus -->
  <script src="app.js" defer></script>
</body>
</html>
